<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudCore Group</title>
  <meta name="description" content="CloudCore Group SASU. Nouveau site bientôt disponible.">
  <style>
    :root {
      --bg: #f6f7f9;
      --text: #18202b;
      --muted: #5b6676;
      --accent: #1f5f8b;
      --soft: #dfe9f2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161c;
        --text: #eef2f6;
        --muted: #a1acba;
        --accent: #7db4dd;
        --soft: #1b2a38;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 20px;
      gap: 20px;
    }
    .mark { width: 96px; height: 96px; }
    h1 { margin: 0; font-size: clamp(30px, 6vw, 44px); letter-spacing: -0.01em; }
    p { margin: 0; color: var(--muted); font-size: 18px; }
    footer { padding: 20px; text-align: center; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 96 96" role="img" aria-label="Logo CloudCore Group">
      <rect width="96" height="96" rx="24" fill="var(--soft)"/>
      <circle cx="48" cy="48" r="26" fill="none" stroke="var(--accent)" stroke-width="5"/>
      <circle cx="48" cy="48" r="10" fill="var(--accent)"/>
      <path d="M48 14v12M48 70v12M14 48h12M70 48h12" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <h1>CloudCore Group</h1>
    <p>Notre nouveau site arrive bientôt.</p>
  </main>
  <footer>© 2026 CloudCore Group SASU · Hébergement : GitHub, Inc., San Francisco, États-Unis</footer>
</body>
</html>
